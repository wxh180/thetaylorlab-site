<article class="person" id="{{ m.name|slug }}">
  <img src="{{ root }}{{ m.photo }}" alt="Portrait of {{ m.name }}" loading="lazy">
  <div class="person-body">
    <h3>{{ m.name }}</h3>
    <p class="role">{{ m.role }}</p>
    {% if m.linkedin %}<p class="person-links"><a href="{{ m.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></p>{% endif %}
    {% if m.bio %}
    <details>
      <summary>Read bio</summary>
      {% for para in m.bio|paragraphs %}<p>{{ para }}</p>{% endfor %}
    </details>
    {% endif %}
  </div>
</article>
