- year: 2022
  title: Structure of the Anthrax Protective Antigen D425A Dominant Negative Mutant Reveals a Stalled Intermediate State of Pore Maturation
  citation: Scott, H., Huang, W., Andra, K., Mamillapalli, S., Gonti, S., Day, A., Zhang, K., Mehzabeen, N., Battaile, K.P., Raju, A., Lovell, S., Bann, J.G. and Taylor, D.J., 2022. Journal of Molecular Biology, 434(9), p.167548.
  abstract: The tripartite protein complex produced by anthrax bacteria ( Bacillus anthracis ) is a member of the AB family of β-barrel pore-forming toxins. The protective antigen (PA) component forms an oligomeric prepore that assembles on the host cell surface and serves as a scaffold for binding of lethal and edema factors. Following endocytosis, the acidic environment of the late endosome triggers a pH-induced conformational rearrangement to promote maturation of the PA prepore to a functional, membrane spanning pore that facilitates delivery of lethal and edema factors to the cytosol of the infected host. Here, we show that the dominant-negative D425A mutant of PA stalls anthrax pore maturation in an intermediate state at acidic pH. Our 2.7 Å cryo-EM structure of the intermediate state reveals structural rearrangements that involve constriction of the oligomeric pore combined with an intramolecular dissociation of the pore-forming module. In addition to defining the early stages of anthrax pore maturation, the structure identifies asymmetric conformational changes in the oligomeric pore that are influenced by the precise configuration of adjacent protomers.
  link: https://pubmed.ncbi.nlm.nih.gov/35304125/
  image: assets/img/pubs/2022-anthrax-pa.webp
- year: 2021
  title: Potent neutralizing nanobodies resist convergent circulating variants of SARS-CoV-2 by targeting diverse and conserved epitopes
  citation: Sun, D., Sang, Z., Kim, Y.J., Xiang, Y., Cohen, T., Belford, A.K., Huet, A., Conway, J.F., Sun, J., Taylor, D.J., Schneidman-Duhovny, D., Zhang, C., Huang, W. and Shi, Y., 2021. Nature communications, 12 (1), p.4676.
  abstract: 'Interventions against variants of severe acute respiratory syndrome coronavirus 2 (SARS-CoV-2) are urgently needed. Stable and potent nanobodies (Nbs) that target the receptor binding domain (RBD) of SARS-CoV-2 spike are promising therapeutics. However, it is unknown if Nbs broadly neutralize circulating variants. We found that RBD Nbs are highly resistant to variants of concern (VOCs). High-resolution cryoelectron microscopy determination of eight Nb-bound structures reveals multiple potent neutralizing epitopes clustered into three classes: Class I targets ACE2-binding sites and disrupts host receptor binding. Class II binds highly conserved epitopes and retains activity against VOCs and RBD SARS-CoV. Cass III recognizes unique epitopes that are likely inaccessible to antibodies. Systematic comparisons of neutralizing antibodies and Nbs provided insights into how Nbs target the spike to achieve high-affinity and broadly neutralizing activity. Structure-function analysis of Nbs indicates a variety of antiviral mechanisms. Our study may guide the rational design of pan-coronavirus vaccines and therapeutics.'
  link: https://pubmed.ncbi.nlm.nih.gov/34344900/
