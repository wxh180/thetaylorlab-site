- year: 2021
  title: SLX4IP promotes RAP1 SUMOylation by PIAS1 to coordinate telomere maintenance through NF-κB and Notch signaling
  citation: Robinson, N.J., Miyagi, M., Scarborough, J.A., Scott, J.G., Taylor, D.J. and Schiemann, W.P., 2021. Science signaling, 14 (689), p.eabe9613.
  abstract: The maintenance of telomere length supports repetitive cell division and therefore plays a central role in cancer development and progression. Telomeres are extended by either the enzyme telomerase or the alternative lengthening of telomeres (ALT) pathway. Here, we found that the telomere-associated protein SLX4IP dictates telomere proteome composition by recruiting and activating the E3 SUMO ligase PIAS1 to the SLX4 complex. PIAS1 SUMOylated the telomere-binding protein RAP1, which disrupted its interaction with the telomere-binding protein TRF2 and facilitated its nucleocytoplasmic shuttling. In the cytosol, RAP1 bound to IκB kinase (IKK), resulting in activation of the transcription factor NF-κB and its induction of Jagged-1 expression, which promoted Notch signaling and the institution of ALT. This axis could be targeted therapeutically in ALT-driven cancers and in tumor cells that develop resistance to antitelomerase therapies. Our results illuminate the mechanisms underlying SLX4IP-dependent telomere plasticity and demonstrate the role of telomere proteins in directly coordinating intracellular signaling and telomere maintenance dynamics.
  link: https://pubmed.ncbi.nlm.nih.gov/34187905/
  image: assets/img/pubs/2021-slx4ip-rap1.webp
- year: 2021
  title: Active and passive destabilization of G-quadruplex DNA by the telomere POT1-TPP1 complex
  citation: Xu, M., Axhemi, A., Malgowska, M., Chen, Y., Leonard, D., Srinivasan, S., Jankowsky, E. and Taylor, D.J., 2021. Journal of molecular biology, 433 (7), p.166846.
  abstract: Chromosome ends are protected by guanosine-rich telomere DNA that forms stable G-quadruplex (G4) structures. The heterodimeric POT1-TPP1 complex interacts specifically with telomere DNA to shield it from illicit DNA damage repair and to resolve secondary structure that impedes telomere extension. The mechanism by which POT1-TPP1 accomplishes these tasks is poorly understood. Here, we establish the kinetic framework for POT1-TPP1 binding and unfolding of telomere G4 DNA. Our data identify two modes of POT1-TPP1 destabilization of G4 DNA that are governed by protein concentration. At low concentrations, POT1-TPP1 passively captures transiently unfolded G4s. At higher concentrations, POT1-TPP1 proteins bind to G4s to actively destabilize the DNA structures. Cancer-associated POT1-TPP1 mutations impair multiple reaction steps in this process, resulting in less efficient destabilization of G4 structures. The mechanistic insight highlights the importance of cell cycle dependent expression and localization of the POT1-TPP1 complex and distinguishes diverse functions of this complex in telomere maintenance.
  link: https://pubmed.ncbi.nlm.nih.gov/33549587/
  image: assets/img/pubs/2021-pot1-g4.webp
- year: 2021
  title: SLX4IP Promotes Telomere Maintenance in Androgen Receptor–Independent Castration-Resistant Prostate Cancer through ALT-like Telomeric PML Localization
  citation: Mangosh, T.L., Awadallah, W.N., Grabowska, M.M. and Taylor, D.J., 2021. Molecular Cancer Research, 19 (2), pp.301-316.
  abstract: 'In advanced prostate cancer, resistance to androgen deprivation therapy is achieved through numerous mechanisms, including loss of the androgen receptor (AR) allowing for AR-independent growth. Therapeutic options are limited for AR-independent castration-resistant prostate cancer (CRPC), and defining mechanisms critical for survival is of utmost importance for targeting this lethal disease. Our studies focus on identifying telomere maintenance mechanism (TMM) hallmarks adopted by CRPC to promote survival. TMMs are responsible for telomere elongation to instill replicative immortality and prevent senescence, with the two TMM pathways available being telomerase and alternative lengthening of telomeres (ALT). Here, we show that AR-independent CRPC demonstrates an atypical ALT-like phenotype with variable telomerase expression and activity, whereas AR-dependent models lack discernible ALT hallmarks. In addition, AR-independent CRPC cells exhibited elevated levels of SLX4IP, a protein implicated in promoting ALT. SLX4IP overexpression in AR-dependent C4-2B cells promoted an ALT-like phenotype and telomere maintenance. SLX4IP knockdown in AR-independent DU145 and PC-3 cells led to ALT-like hallmark reduction, telomere shortening, and induction of senescence. In PC-3 xenografts, this effect translated to reduced tumor volume. Using an in vitro model of AR-independent progression, loss of AR in AR-dependent C4-2B cells promoted an atypical ALT-like phenotype in an SLX4IP-dependent manner. Insufficient SLX4IP expression diminished ALT-like hallmarks and resulted in accelerated telomere loss and senescence.


    This study demonstrates a unique reliance of AR-independent CRPC on SLX4IP-mediated ALT-like hallmarks and loss of these hallmarks induces telomere shortening and senescence, thereby impairing replicative immortality.'
  link: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8086381/
  image: assets/img/pubs/2021-slx4ip-crpc.webp
- year: 2021
  title: SLX4IP N-terminus dictates telomeric localization in ALT-like castration-resistant prostate cancer cell lines
  citation: Mangosh, T.L., Grabowska, M.M. and Taylor, D.J., 2021. The Prostate, 81 (15), pp.1235-1251.
  abstract: 'Background: To ensure replicative immortality in cancer, telomeres must be maintained through activation of telomere maintenance mechanisms (TMMs) that are dependent on telomerase or the alternative lengthening of telomeres (ALT) pathway. Although TMM pathways have traditionally been considered to be mutually exclusive, ALT hallmarks have been identified in cancers defined as being telomerase-positive, supporting TMM coexistence. In castration-resistant prostate cancer (CRPC), in vitro models were thought to be universally dependent on telomerase as the primary TMM; however, CRPC models with androgen receptor (AR) loss demonstrate ALT hallmarks with limited telomerase activity and require ALT-associated PML bodies (APBs) for sustained telomere maintenance. The TMM coexistence in AR-negative CRPC is reliant on the ALT regulator protein, SLX4IP.


    Methods: To identify the regions of SLX4IP responsible for the induction of APBs and telomere preservation in CRPC models, five 3xFLAG-tagged SLX4IP constructs were designed and stably introduced into parental C4-2B, DU145, and PC-3 cells. Once generated, these cell lines were interrogated for APB abundance and SLX4IP construct localization via immunofluorescence-fluorescence in situ hybridization (IF-FISH) and coimmunoprecipitation experiments for telomeric localization. Similarly, PC-3 cells with endogenous SLX4IP knockdown and SLX4IP construct introduction were interrogated for APB abundance, telomere length preservation, and senescent rescue.


    Results: Here, we define the N-terminus of SLX4IP as being responsible for the promotion of the ALT-like phenotype of AR-negative CRPC models. Specifically, the N-terminus of SLX4IP was sufficient for promoting APB formation to a similar degree as full-length SLX4IP across CRPC cell lines. Additionally, APB promotion by the N-terminus of SLX4IP rescued telomere shortening and senescent induction triggered by SLX4IP knockdown in AR-negative CRPC cells. Moreover, APB formation and telomere maintenance were dependent on the ability of the N-terminus to direct SLX4IP localization at telomeres and APBs.


    Conclusions: These findings identify the role of the uncharacterized ALT regulator SLX4IP in the promotion of TMM coexistence to perpetuate replicative immortality in CRPC in vitro.'
  link: https://pubmed.ncbi.nlm.nih.gov/34492133/
