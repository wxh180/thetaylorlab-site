- year: 2024
  title: The specificity landscape of bacterial ribonuclease P
  citation: Chamberlain, A.R., Huynh, L., Huang, W., Taylor, D.J. and Harris, M.E., 2024. Journal of Biological Chemistry, 300(1), p.105498.
  abstract: Developing quantitative models of substrate specificity for RNA processing enzymes is a key step toward understanding their biology and guiding applications in biotechnology and biomedicine. Optimally, models to predict relative rate constants for alternative substrates should integrate an understanding of structures of the enzyme bound to “fast” and “slow” substrates, large datasets of rate constants for alternative substrates, and transcriptomic data identifying in vivo processing sites. Such data are either available or emerging for bacterial ribonucleoprotein RNase P a widespread and essential tRNA 5′ processing endonuclease, thus making it a valuable model system for investigating principles of biological specificity. Indeed, the well-established structure and kinetics of bacterial RNase P enabled the development of high throughput measurements of rate constants for tRNA variants and provided the necessary framework for quantitative specificity modeling. Several studies document the importance of conformational changes in the precursor tRNA substrate as well as the RNA and protein subunits of bacterial RNase P during binding, although the functional roles and dynamics are still being resolved. Recently, results from cryo-EM studies of E. coli RNase P with alternative precursor tRNAs are revealing prospective mechanistic relationships between conformational changes and substrate specificity. Yet, extensive uncharted territory remains, including leveraging these advances for drug discovery, achieving a complete accounting of RNase P substrates, and understanding how the cellular context contributes to RNA processing specificity in vivo.
  link: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC10731613/
  image: assets/img/pubs/2024-rnasep-specificity.webp
- year: 2023
  title: Loss of LCMT1 and biased protein phosphatase 2A heterotrimerization drive prostate cancer progression and therapy resistance
  citation: Rasool, R.U., O’Connor, C.M., Das, C.K., Alhusayan, M., Verma, B.K., Islam, S., Frohner, I.E., Deng, Q., Mitchell-Velasquez, E., Sangodkar, J., Ahmed, A., Linauer, S., Mudrak, I., Rainey, J., Zawacki, K.P., Suhan, T.K., Callahan, C.G., Rebernick, R., Natesan, R., Siddiqui, J., Sauter, G., Thomas, D., Wang, S., Taylor, D.J., Simon, R., Cieslik, M., Chinnaiyan, A.M., Busino, L., Ogris, E., Narla, G. and Asangani, I.A., 2023. Nature Communications, 14(1), p.5253.
  abstract: Loss of the tumor suppressive activity of the protein phosphatase 2A (PP2A) is associated with cancer, but the underlying molecular mechanisms are unclear. PP2A holoenzyme comprises a heterodimeric core, a scaffolding A subunit and a catalytic C subunit, and one of over 20 distinct substrate-directing regulatory B subunits. Methylation of the C subunit regulates PP2A heterotrimerization, affecting B subunit binding and substrate specificity. Here, we report that the leucine carboxy methyltransferase (LCMT1), which methylates the L309 residue of the C subunit, acts as a suppressor of androgen receptor (AR) addicted prostate cancer (PCa). Decreased methyl-PP2A-C levels in prostate tumors is associated with biochemical recurrence and metastasis. Silencing LCMT1 increases AR activity and promotes castration-resistant prostate cancer growth. LCMT1-dependent methyl-sensitive AB56αCme heterotrimers target AR and its critical coactivator MED1 for dephosphorylation, resulting in the eviction of the AR-MED1 complex from chromatin and loss of target gene expression. Mechanistically, LCMT1 is regulated by S6K1-mediated phosphorylation-induced degradation requiring the β-TRCP, leading to acquired resistance to anti-androgens. Finally, feedforward stabilization of LCMT1 by small molecule activator of phosphatase (SMAP) results in attenuation of AR-signaling and tumor growth inhibition in anti-androgen refractory PCa. These findings highlight methyl-PP2A-C as a prognostic marker and that the loss of LCMT1 is a major determinant in AR-addicted PCa, suggesting therapeutic potential for AR degraders or PP2A modulators in prostate cancer treatment.
  link: https://pubmed.ncbi.nlm.nih.gov/37644036/
  image: assets/img/pubs/2023-lcmt1.webp
- year: 2023
  title: Small molecule inhibitors of 15-PGDH exploit a physiologic induced-fit closing system
  citation: Huang, W., Li, H., Kiselar, J., Fink, S.P., Regmi, S., Day, A., Yuan, Y., Chance, M., Ready, J.M., Markowitz, S.D. and Taylor, D.J., 2023. Nature communications, 14 (1), p.784.
  abstract: 15-prostaglandin dehydrogenase (15-PGDH) is a negative regulator of tissue stem cells that acts via enzymatic activity of oxidizing and degrading PGE2, and related eicosanoids, that support stem cells during tissue repair. Indeed, inhibiting 15-PGDH markedly accelerates tissue repair in multiple organs. Here we have used cryo-electron microscopy to solve the solution structure of native 15-PGDH and of 15-PGDH individually complexed with two distinct chemical inhibitors. These structures identify key 15-PGDH residues that mediate binding to both classes of inhibitors. Moreover, we identify a dynamic 15-PGDH lid domain that closes around the inhibitors, and that is likely fundamental to the physiologic 15-PGDH enzymatic mechanism. We furthermore identify two key residues, F185 and Y217, that act as hinges to regulate lid closing, and which both inhibitors exploit to capture the lid in the closed conformation, thus explaining their sub-nanomolar binding affinities. These findings provide the basis for further development of 15-PGDH targeted drugs as therapeutics for regenerative medicine.
  link: https://pubmed.ncbi.nlm.nih.gov/36774348/
  image: https://media.springernature.com/lw685/springer-static/image/art%3A10.1038%2Fs41467-023-36463-7/MediaObjects/41467_2023_36463_Fig6_HTML.png?as=webp
- year: 2023
  title: The structural basis of tRNA recognition by arginyl-tRNA-protein transferase
  citation: Abeywansha, T., Huang, W., Ye, X., Nawrocki, A., Lan, X., Jankowsky, E., Taylor, D.J. and Zhang, Y., 2023. Nature Communications, 14 (1), p.2232.
  abstract: Arginyl-tRNA-protein transferase 1 (ATE1) is a master regulator of protein homeostasis, stress response, cytoskeleton maintenance, and cell migration. The diverse functions of ATE1 arise from its unique enzymatic activity to covalently attach an arginine onto its protein substrates in a tRNA-dependent manner. However, how ATE1 (and other aminoacyl-tRNA transferases) hijacks tRNA from the highly efficient ribosomal protein synthesis pathways and catalyzes the arginylation reaction remains a mystery. Here, we describe the three-dimensional structures of Saccharomyces cerevisiae ATE1 with and without its tRNA cofactor. Importantly, the putative substrate binding domain of ATE1 adopts a previously uncharacterized fold that contains an atypical zinc-binding site critical for ATE1 stability and function. The unique recognition of tRNA Arg by ATE1 is coordinated through interactions with the major groove of the acceptor arm of tRNA. Binding of tRNA induces conformational changes in ATE1 that helps explain the mechanism of substrate arginylation.
  link: https://pubmed.ncbi.nlm.nih.gov/37076488/
  image: assets/img/pubs/2023-ate1-trna.webp
- year: 2023
  title: Oligomerization-mediated activation of a short prokaryotic Argonaute
  citation: Shen, Z., Yang, X.Y., Xia, S., Huang, W., Taylor, D.J., Nakanishi, K. and Fu, T.M., 2023. Nature, 621(7977), pp.154-161.
  abstract: Although eukaryotic and long prokaryotic Argonaute proteins (pAgos) cleave nucleic acids, some short pAgos lack nuclease activity and hydrolyse NAD(P) + to induce bacterial cell death 1. Here we present a hierarchical activation pathway for SPARTA, a short pAgo consisting of an Argonaute (Ago) protein and TIR–APAZ, an associated protein 2. SPARTA progresses through distinct oligomeric forms, including a monomeric apo state, a monomeric RNA–DNA-bound state, two dimeric RNA–DNA-bound states and a tetrameric RNA–DNA-bound active state. These snapshots together identify oligomerization as a mechanistic principle of SPARTA activation. The RNA–DNA-binding channel of apo inactive SPARTA is occupied by an auto-inhibitory motif in TIR–APAZ. After the binding of RNA–DNA, SPARTA transitions from a monomer to a symmetric dimer and then an asymmetric dimer, in which two TIR domains interact through charge and shape complementarity. Next, two dimers assemble into a tetramer with a central TIR cluster responsible for hydrolysing NAD(P) +. In addition, we observe unique features of interactions between SPARTA and RNA–DNA, including competition between the DNA 3′ end and the auto-inhibitory motif, interactions between the RNA G2 nucleotide and Ago, and splaying of the RNA–DNA duplex by two loops exclusive to short pAgos. Together, our findings provide a mechanistic basis for the activation of short pAgos, a large section of the Ago superfamily.
  link: https://pubmed.ncbi.nlm.nih.gov/37494956/
  image: assets/img/pubs/2023-sparta.webp
- year: 2022
  title: Structural and mechanistic basis for recognition of alternative tRNA precursor substrates by bacterial ribonuclease P
  citation: Zhu, J., Huang, W., Zhao, J., Huynh, L., Taylor, D.J. and Harris, M.E., 2022. Nature Communications, 13 (1), p.5120.
  abstract: Binding of precursor tRNAs (ptRNAs) by bacterial ribonuclease P (RNase P) involves an encounter complex (ES) that isomerizes to a catalytic conformation (ES*). However, the structures of intermediates and the conformational changes that occur during binding are poorly understood. Here, we show that pairing between the 5′ leader and 3′RCCA extending the acceptor stem of ptRNA inhibits ES* formation. Cryo-electron microscopy single particle analysis reveals a dynamic enzyme that becomes ordered upon formation of ES* in which extended acceptor stem pairing is unwound. Comparisons of structures with alternative ptRNAs reveals that once unwinding is completed RNase P primarily uses stacking interactions and shape complementarity to accommodate alternative sequences at its cleavage site. Our study reveals active site interactions and conformational changes that drive molecular recognition by RNase P and lays the foundation for understanding how binding interactions are linked to helix unwinding and catalysis.
  link: https://pubmed.ncbi.nlm.nih.gov/36045135/
  image: assets/img/pubs/2022-rnasep.webp
- year: 2022
  title: Superimmunity by pan-sarbecovirus nanobodies
  citation: Xiang, Y., Huang, W., Liu, H., Sang, Z., Nambulli, S., Tubiana, J., Williams Jr, K.L., Duprex, W.P., Schneidman-Duhovny, D., Wilson, I.A., Taylor, D.J. and Shi, Y., 2022. Cell Reports, 39(13), p.111004.
  abstract: Vaccine boosters and infection can facilitate the development of SARS-CoV-2 antibodies with improved potency and breadth. Here, we observe superimmunity in a camelid extensively immunized with the SARS-CoV-2 receptor-binding domain (RBD). We rapidly isolate a large repertoire of specific ultra-high-affinity nanobodies that bind strongly to all known sarbecovirus clades using integrative proteomics. These pan-sarbecovirus nanobodies (psNbs) are highly effective against SARS-CoV and SARS-CoV-2 variants, including Omicron, with the best median neutralization potency at single-digit nanograms per milliliter. A highly potent, inhalable, and bispecific psNb (PiN-31) is also developed. Structural determinations of 13 psNbs with the SARS-CoV-2 spike or RBD reveal five epitope classes, providing insights into the mechanisms and evolution of their broad activities. The highly evolved psNbs target small, flat, and flexible epitopes that contain over 75% of conserved RBD surface residues. Their potencies are strongly and negatively correlated with the distance of the epitopes from the receptor binding sites.
  link: https://pubmed.ncbi.nlm.nih.gov/35738279/
