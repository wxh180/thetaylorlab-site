  title: Regulatory mechanisms of PP2A complex assembly driven by physicochemical differences in A-subunit isoforms
  citation: Day, A., Huang, W., Leonard, D., O’Connor, C.M., Narla, G. and Taylor, D.J., 2025, Structure 33, 1688–1699.
  abstract: Protein phosphatase 2A (PP2A) is crucial for regulating cellular pathways, with its holoenzyme assembly affecting enzyme function and substrate selection. The PP2A holoenzyme comprises scaffold A-, regulatory B-, and catalytic C-subunits, each with various isoforms. Here, we examine structural and biochemical characteristics of the A-subunit isoforms (Aα and Aβ) and identify different biophysical properties that may promote distinct PP2A functions. Our molecular dynamics simulations and cryo-EM analyses define structural differences in the isoforms that reside primarily at the N-terminus of the A-subunit where it interfaces with regulatory B-subunits. Kinetic analyses show Aβ has a lower binding affinity in complexes with B56 subunits and exhibits unique aggregative properties as a monomeric protein. These findings suggest that the different physicochemical properties between A-subunit isoforms are key to PP2A holoenzyme assembly and function. We predict that the Aβ serves as a reservoir, ensuring that serine-threonine phosphatase activity is maintained during high regulatory demand.
